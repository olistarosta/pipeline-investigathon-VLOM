[project]
name = "pipeline-investigathon-vlom"
version = "1.0.0"
description = "Los dos pipelines finales del grupo VLOM (Investigathon, task Y-Hat): rankear empresas por probabilidad de ganar una licitación."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "numba>=0.68.0",
    "numpy>=2.2",
    "pandas>=3.0",
    "pillow>=13.0.0",
    "pyarrow>=25",
    "scikit-learn>=1.9.1",
    "scipy>=1.17",
    "sentence-transformers>=5.1",
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.56",
]

[tool.uv]
package = false

# PyTorch con CUDA 12.8 en Windows y Linux (también corre en CPU); en Mac, el de PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
